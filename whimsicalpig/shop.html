<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — The Whimsical Pig</title>
<meta name="description" content="Shop ready-made pieces from The Whimsical Pig, or pay an invoice or deposit online.">
<meta name="theme-color" content="#16040c">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@400;500;700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,600,100,1;1,9..144,500,100,1&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  main { padding: 48px 0 72px; }

  /* Quick pay */
  .quickpay {
    display: flex;
    align-items: center;
    gap: 22px;
    max-width: 850px;
    margin: 0 auto 48px;
    padding: 22px 26px;
    border-radius: var(--radius);
    background: linear-gradient(135deg, rgba(235, 167, 185, 0.16), rgba(235, 167, 185, 0.05));
    border: 1px dashed rgba(235, 167, 185, 0.55);
  }
  .quickpay .icon {
    flex: none;
    display: grid;
    place-items: center;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: rgba(235, 167, 185, 0.18);
    color: var(--pink);
  }
  .quickpay .icon svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .quickpay h2 { font-size: 1.45rem; }
  .quickpay p { color: var(--text-dim); font-size: 0.95rem; }
  .quickpay .btn { margin-left: auto; white-space: nowrap; }

  /* Filters */
  .filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: -8px 0 34px;
  }
  .filters button {
    padding: 5px 16px 7px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-dim);
    font: 500 1rem "Alegreya Sans SC", sans-serif;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .filters button:hover { color: var(--gold); border-color: var(--gold); }
  .filters button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #1a0509; }

  /* Items, shown as framed pieces */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 34px 26px;
    max-width: 900px;
    margin: 0 auto;
  }
  .item { display: flex; flex-direction: column; }
  .item[hidden] { display: none; }
  .frame {
    padding: 9px;
    border-radius: 3px;
    background: linear-gradient(135deg, #6b4a1f, #3b2410 45%, #7a5626 70%, #3b2410);
    box-shadow: 0 14px 26px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 220, 150, 0.25);
    transform: rotate(var(--tilt, 0deg));
    transition: transform .25s ease;
  }
  .item:hover .frame { transform: rotate(0deg) translateY(-3px); }
  .mat { padding: 10px; background: #efe6d2; box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35); }
  .pic {
    position: relative;
    aspect-ratio: 1 / 1;
    background: radial-gradient(circle at 50% 45%, #4a2a3c, #2c1322 75%);
    overflow: hidden;
  }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .sold {
    position: absolute;
    top: 12px;
    right: -34px;
    z-index: 2;
    width: 130px;
    padding: 3px 0;
    background: var(--pink-deep);
    color: #fff;
    text-align: center;
    font: 700 0.85rem "Alegreya Sans SC", sans-serif;
    transform: rotate(45deg);
  }
  .info { padding: 16px 4px 0; text-align: center; }
  .info h3 { font-size: 1.2rem; }
  .info .note { color: var(--text-dim); font-size: 0.9rem; margin-top: 2px; }
  .info .price {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 12px;
    border-radius: 4px;
    background: linear-gradient(180deg, #f3dc86, #d6ab35 55%, #b98f25);
    color: #2a1405;
    font-weight: 700;
  }
  .info .btn { margin-top: 12px; padding: 8px 20px; font-size: 1rem; }

  .custom {
    max-width: 850px;
    margin: 64px auto 0;
    text-align: center;
  }
  .custom h2 { font-size: 1.6rem; margin-bottom: 14px; }

  @media (max-width: 760px) {
    main { padding-top: 32px; }
    .quickpay { flex-direction: column; text-align: center; }
    .quickpay .btn { margin: 4px 0 0; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 26px 14px; }
    .frame { padding: 6px; }
    .mat { padding: 6px; }
    .info h3 { font-size: 1.02rem; }
  }
</style>
</head>
<body data-page="shop">

<header id="site-header"></header>

<main>
  <div class="wrap">
    <div class="head">
      <h1 data-tail>Shop</h1>
    </div>

    <div class="quickpay">
      <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg></span>
      <div>
        <h2>Quick Pay</h2>
        <p>Pay an invoice, deposit, or balance.</p>
      </div>
      <a class="btn pink" id="quickpay-btn" href="tel:315-773-3758">Pay now</a>
    </div>

    <div class="filters" id="filters" role="group" aria-label="Filter items"></div>
    <div class="grid" id="grid"></div>

    <div class="custom">
      <h2>Looking for something one-of-a-kind?</h2>
      <a class="btn ghost" href="order.html">Start a custom order →</a>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="site.js"></script>
<script src="shop-items.js"></script>
<script>
  const shop = window.SHOP || { items: [] };

  // Quick pay: use the payment link if there is one, otherwise call the shop
  const qp = document.getElementById("quickpay-btn");
  if (shop.quickPay && shop.quickPay.buyUrl) {
    qp.href = shop.quickPay.buyUrl;
  } else {
    qp.textContent = "Call to pay";
  }

  const grid = document.getElementById("grid");
  const tilts = [-1.2, 0.9, -0.5, 1.3, -0.8, 0.6];
  shop.items.forEach((it, i) => {
    const card = document.createElement("article");
    card.className = "item";
    card.dataset.category = it.category || "";
    card.innerHTML = `
      <div class="frame"><div class="mat"><div class="pic"><img alt="" loading="lazy"></div></div></div>
      <div class="info">
        <h3></h3>
        <p class="note"></p>
        <span class="price"></span><br>
        <a class="btn"></a>
      </div>`;
    card.querySelector(".frame").style.setProperty("--tilt", tilts[i % tilts.length] + "deg");
    const img = card.querySelector("img");
    img.alt = it.name;
    loadImg(img, it.image, it.live ? liveImage(it.live) : "");
    card.querySelector("h3").textContent = it.name;
    const note = card.querySelector(".note");
    if (it.note) note.textContent = it.note; else note.remove();
    const price = card.querySelector(".price");
    if (it.price) {
      price.textContent = it.price;
    } else {
      price.nextElementSibling.remove();   // the <br> after it
      price.remove();
    }

    const btn = card.querySelector(".btn");
    if (it.soldOut) {
      card.querySelector(".pic").insertAdjacentHTML("beforeend", '<span class="sold">sold out</span>');
      btn.textContent = "Sold out";
      btn.setAttribute("aria-disabled", "true");
      btn.style.opacity = ".45";
      btn.style.pointerEvents = "none";
    } else if (it.buyUrl) {
      btn.textContent = "Buy now";
      btn.href = it.buyUrl;
    } else {
      btn.textContent = "Call to order";
      btn.classList.add("ghost");
      btn.href = "tel:315-773-3758";
    }
    grid.appendChild(card);
  });

  // Category filters (only shown when there's more than one category)
  const cats = [...new Set(shop.items.map(it => it.category).filter(Boolean))];
  const filters = document.getElementById("filters");
  if (cats.length > 1) {
    for (const c of ["All", ...cats]) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c.toLowerCase();
      b.setAttribute("aria-pressed", c === "All");
      b.onclick = () => {
        for (const o of filters.children) o.setAttribute("aria-pressed", o === b);
        for (const card of grid.children) card.hidden = c !== "All" && card.dataset.category !== c;
      };
      filters.appendChild(b);
    }
  } else {
    filters.remove();
  }
</script>
</body>
</html>
