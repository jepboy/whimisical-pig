<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — The Whimsical Pig</title>
<meta name="description" content="Shop ready-made pieces from The Whimsical Pig, or pay an invoice or deposit online.">
<meta name="theme-color" content="#1a1816">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  main { padding: 72px 0 96px; }

  /* Quick pay */
  .quickpay {
    display: flex;
    align-items: center;
    gap: 26px;
    max-width: 900px;
    margin: 0 auto 64px;
    padding: 28px 32px;
    background: var(--panel);
    border: 1px solid var(--rule);
  }
  .quickpay .icon {
    flex: none;
    display: grid;
    place-items: center;
    width: 56px;
    height: 56px;
    border: 1px solid var(--rule);
    color: var(--brass);
  }
  .quickpay .icon svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .quickpay h2 { font-size: 1.8rem; }
  .quickpay p { color: var(--muted); }
  .quickpay .btn { margin-left: auto; white-space: nowrap; }
  .quickpay[hidden] { display: none; }
  #giftcard { margin-top: -40px; }

  /* Filters */
  .filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 22px;
    margin: -12px 0 44px;
  }
  .filters button {
    padding: 6px 2px;
    border: 0;
    border-bottom: 1px solid transparent;
    background: none;
    color: var(--muted);
    font: 700 0.74rem var(--sans);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .filters button:hover { color: var(--cream); }
  .filters button[aria-pressed="true"] { color: var(--brass); border-bottom-color: var(--brass); }

  /* Items, each hung in a frame */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 56px 36px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .item { display: flex; flex-direction: column; }
  .item[hidden] { display: none; }
  .item .frame { padding: 10px; }
  .item .mat { padding: 14px; }
  .item .pic { aspect-ratio: 1 / 1; }
  .sold {
    position: absolute;
    top: 14px;
    left: 0;
    z-index: 2;
    padding: 4px 12px;
    background: var(--ink);
    color: var(--cream);
    font: 700 0.68rem var(--sans);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .info { padding-top: 20px; text-align: center; }
  .info h3 { font-size: 1.5rem; }
  .info .note { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
  .info .price {
    display: inline-block;
    margin-top: 10px;
    font: 600 1.35rem var(--serif);
    color: var(--brass-soft);
  }
  .info .btn { margin-top: 16px; padding: 11px 22px; }

  .custom {
    max-width: 900px;
    margin: 88px auto 0;
    padding-top: 48px;
    border-top: 1px solid var(--rule);
    text-align: center;
  }
  .custom h2 { font-size: 2rem; margin-bottom: 20px; }

  @media (max-width: 860px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 40px 20px; }
  }
  @media (max-width: 640px) {
    main { padding-top: 48px; }
    .quickpay { flex-direction: column; text-align: center; padding: 26px 20px; }
    .quickpay .btn { margin: 4px 0 0; }
    .item .frame { padding: 6px; }
    .item .mat { padding: 7px; }
    .info h3 { font-size: 1.2rem; }
    .info .btn { padding: 10px 14px; letter-spacing: 0.12em; }
  }
</style>
</head>
<body data-page="shop">

<header id="site-header"></header>

<main>
  <div class="wrap">
    <div class="head">
      <span class="eyebrow">Ready-made &amp; quick pay</span>
      <h1 data-tail>The Shop</h1>
    </div>

    <div class="quickpay">
      <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg></span>
      <div>
        <h2>Quick Pay</h2>
        <p>Pay an invoice, deposit, or balance.</p>
      </div>
      <a class="btn" id="quickpay-btn" href="tel:315-773-3758">Pay now</a>
    </div>

    <div class="quickpay" id="giftcard" hidden>
      <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="1"/><path d="M12 8v12M3 12h18"/><path d="M12 8c-2-4-6-3-5 0M12 8c2-4 6-3 5 0"/></svg></span>
      <div>
        <h2>Gift Cards</h2>
        <p>Let them choose their own piece.</p>
      </div>
      <a class="btn ghost" id="giftcard-btn" href="#">Buy a Gift Card</a>
    </div>

    <div class="filters" id="filters" role="group" aria-label="Filter items"></div>
    <div class="grid" id="grid"></div>

    <div class="custom">
      <h2>Looking for something one-of-a-kind?</h2>
      <a class="btn ghost" href="order.html">Start a Custom Order</a>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="settings.js"></script>
<script src="site.js"></script>
<script src="shop-items.js"></script>
<script>
  const shop = window.SHOP || { items: [] };

  // Quick pay: use the payment link if there is one, otherwise call the shop
  const qp = document.getElementById("quickpay-btn");
  if (shop.quickPay && shop.quickPay.buyUrl) {
    qp.href = shop.quickPay.buyUrl;
  } else {
    qp.textContent = "Call to pay";
  }

  // Gift cards (link set in settings.js)
  if (window.SETTINGS && SETTINGS.giftCardUrl) {
    document.getElementById("giftcard").hidden = false;
    document.getElementById("giftcard-btn").href = SETTINGS.giftCardUrl;
  }

  const grid = document.getElementById("grid");
  shop.items.forEach((it, i) => {
    const card = document.createElement("article");
    card.className = "item";
    card.dataset.category = it.category || "";
    card.innerHTML = `
      <div class="frame"><div class="mat"><div class="pic"><span class="ph">photo</span><img alt="" loading="lazy"></div></div></div>
      <div class="info">
        <h3></h3>
        <p class="note"></p>
        <span class="price"></span><br>
        <a class="btn"></a>
      </div>`;
    const img = card.querySelector("img");
    img.alt = it.name;
    loadImg(img, it.image, it.live ? liveImage(it.live) : "");
    card.querySelector("h3").textContent = it.name;
    const note = card.querySelector(".note");
    if (it.note) note.textContent = it.note; else note.remove();
    const price = card.querySelector(".price");
    if (it.price) {
      price.textContent = it.price;
    } else {
      price.nextElementSibling.remove();   // the <br> after it
      price.remove();
    }

    const btn = card.querySelector(".btn");
    if (it.soldOut) {
      card.querySelector(".pic").insertAdjacentHTML("beforeend", '<span class="sold">Sold out</span>');
      btn.textContent = "Sold out";
      btn.setAttribute("aria-disabled", "true");
      btn.style.opacity = ".45";
      btn.style.pointerEvents = "none";
    } else if (it.buyUrl) {
      btn.textContent = "Buy now";
      btn.href = it.buyUrl;
    } else {
      btn.textContent = "Call to order";
      btn.classList.add("ghost");
      btn.href = "tel:315-773-3758";
    }
    grid.appendChild(card);
  });

  // Category filters (only shown when there's more than one category)
  const cats = [...new Set(shop.items.map(it => it.category).filter(Boolean))];
  const filters = document.getElementById("filters");
  if (cats.length > 1) {
    for (const c of ["All", ...cats]) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c;
      b.setAttribute("aria-pressed", c === "All");
      b.onclick = () => {
        for (const o of filters.children) o.setAttribute("aria-pressed", o === b);
        for (const card of grid.children) card.hidden = c !== "All" && card.dataset.category !== c;
      };
      filters.appendChild(b);
    }
  } else {
    filters.remove();
  }
</script>
</body>
</html>
