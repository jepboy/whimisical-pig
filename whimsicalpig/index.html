<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Whimsical Pig</title>
<meta name="description" content="Custom military framing based out of Watertown, New York. Shop ready-made pieces or start a custom order online.">
<meta property="og:title" content="The Whimsical Pig">
<meta property="og:description" content="We make military framing &quot;too easy.&quot; Watertown, NY.">
<meta property="og:type" content="website">
<meta property="og:image" content="images/logo.png">
<meta name="theme-color" content="#16040c">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@400;500;700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,600,100,1;1,9..144,500,100,1&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "The Whimsical Pig",
  "description": "Custom military framing based out of Watertown, New York.",
  "telephone": "+1-315-773-3758",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "50 Public Square, Suite E1",
    "addressLocality": "Watertown",
    "addressRegion": "NY",
    "postalCode": "13601",
    "addressCountry": "US"
  },
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
    "opens": "09:30",
    "closes": "17:30"
  }],
  "sameAs": ["https://www.facebook.com/TheWhimsicalPig/"]

</script>
<style>
  /* ---------- Slideshow band ---------- */
  .band {
    position: relative;
    background: var(--band);
    border-bottom: 1px solid var(--line);
    box-shadow: inset 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 -10px 30px rgba(0, 0, 0, 0.6);
    padding: 26px 20px;
    overflow: hidden;
  }
  /* a sprinkle of tiny gold and pink sparkles */
  .band::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle, rgba(240, 215, 122, 0.5) 1.1px, transparent 1.5px),
      radial-gradient(circle, rgba(235, 167, 185, 0.35) 1px, transparent 1.4px);
    background-size: 90px 90px, 140px 140px;
    background-position: 0 0, 40px 60px;
    opacity: 0.5;
    pointer-events: none;
  }
  .show {
    position: relative;
    max-width: 807px;
    margin: 0 auto;
    aspect-ratio: 807 / 256;
  }
  .show .clip {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    overflow: hidden;
    background: #1f0710;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6);
  }
  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .9s ease;
  }
  .slide.on { opacity: 1; z-index: 1; }
  .slide img { width: 100%; height: 100%; object-fit: cover; }
  .slide .cap {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    padding: 4px 18px 6px;
    border-radius: 999px;
    background: rgba(13, 2, 6, 0.75);
    font-size: 1.35rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .slide:hover .cap { color: var(--gold); }
  .arrow {
    position: absolute;
    top: 50%;
    z-index: 4;
    width: 40px;
    height: 40px;
    margin-top: -20px;
    border: 0;
    border-radius: 50%;
    background: rgba(13, 2, 6, 0.65);
    color: var(--text);
    font-size: 1.4rem;
    line-height: 40px;
    cursor: pointer;
  }
  .arrow:hover { background: var(--gold); color: #1a0509; }
  .prev { left: 10px; }
  .next { right: 10px; }
  .dots {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }
  .dots button {
    width: 10px;
    height: 10px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--gold);
    background: transparent;
    cursor: pointer;
  }
  .dots button[aria-current="true"] { background: var(--gold); }

  /* ---------- Two doors: shop and custom order ---------- */
  .doors {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    max-width: 850px;
    margin: 44px auto 0;
  }
  .door {
    position: relative;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 22px 24px;
    border-radius: var(--radius);
    background: linear-gradient(135deg, #2c0c18, #1b0610);
    border: 1px solid var(--line);
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .door:hover {
    transform: translateY(-3px) rotate(-0.4deg);
    border-color: var(--gold);
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
  }
  .door .icon {
    flex: none;
    display: grid;
    place-items: center;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: rgba(235, 167, 185, 0.14);
    color: var(--pink);
  }
  .door .icon svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .door h2 { font-size: 1.45rem; }
  .door p { color: var(--text-dim); font-size: 0.95rem; }
  .door .go { margin-left: auto; color: var(--gold); font-size: 1.6rem; transition: transform .2s ease; }
  .door:hover .go { transform: translateX(4px); }

  /* ---------- Product collage (same layout as the current site) ---------- */
  .collage-sec { padding: 56px 0 70px; }
  .collage {
    position: relative;
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    aspect-ratio: 850 / 1066;
  }
  .piece {
    position: absolute;
    display: block;
    transform: rotate(var(--tilt, 0deg));
    transition: transform .25s ease;
  }
  .piece .img {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 6px;
    overflow: hidden;
    background: #2a0c18;
    border: 3px solid #f3ead8;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
    transition: box-shadow .25s ease, border-color .25s ease;
  }
  .piece img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: filter .35s ease;
  }
  .piece .label {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100% - 12px);
    padding: 2px 10px 4px;
    border-radius: 999px;
    background: rgba(13, 2, 6, 0.82);
    font-size: 0.98rem;
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: 0.03em;
    text-align: center;
    transition: color .2s ease, background .2s ease;
  }
  .piece.small .label { font-size: 0.8rem; padding: 2px 6px 3px; bottom: 5px; }
  @media (hover: hover) {
    .piece img { filter: grayscale(1) brightness(0.85); }
    .piece:hover img, .piece:focus-visible img { filter: none; }
  }
  .piece:hover, .piece:focus-visible { z-index: 5; transform: rotate(0deg) scale(1.06); }
  .piece:hover .img, .piece:focus-visible .img {
    border-color: var(--gold);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
  }
  .piece:hover .label, .piece:focus-visible .label { background: var(--gold); color: #1a0509; }

  @media (max-width: 760px) {
    .band { padding: 16px 12px; }
    .slide .cap { font-size: 1rem; bottom: 8px; }
    .arrow { width: 32px; height: 32px; margin-top: -16px; line-height: 32px; font-size: 1.1rem; }
    .doors { grid-template-columns: 1fr; margin-top: 32px; }
    .collage {
      aspect-ratio: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .piece { position: static; width: auto !important; height: auto !important; }
    .piece .img { aspect-ratio: 1 / 1; height: auto; }
    .piece .label, .piece.small .label { font-size: 0.9rem; padding: 2px 10px 4px; bottom: 8px; }
  }
</style>
</head>
<body data-page="home">

<header id="site-header"></header>

<main>
  <div class="band">
    <div class="show sc corners" id="show">
      <div class="clip" id="clip"></div>
      <button class="arrow prev" type="button" aria-label="Previous slide">‹</button>
      <button class="arrow next" type="button" aria-label="Next slide">›</button>
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="wrap">
    <div class="doors">
      <a class="door" href="shop.html">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>
        <span>
          <h2>Shop</h2>
          <p>Ready-made pieces &amp; quick pay</p>
        </span>
        <span class="go" aria-hidden="true">→</span>
      </a>
      <a class="door" href="order.html">
        <span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><rect x="7.5" y="6.5" width="9" height="7" rx="1"/><path d="M8 17h8"/></svg></span>
        <span>
          <h2>Start an order</h2>
          <p>Shadow boxes, flags, guidons &amp; more</p>
        </span>
        <span class="go" aria-hidden="true">→</span>
      </a>
    </div>
  </div>

  <section class="collage-sec">
    <div class="wrap">
      <div class="head">
        <h2 data-tail>Our Work</h2>
      </div>
      <div class="collage sc" id="collage"></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="site.js"></script>
<script>
  // ---- Slideshow (same three banners as the current site) ----
  const slides = [
    ["military framing", "slide-military-framing.jpg", "1.png", "military-framing.html"],
    ["custom apparel", "slide-custom-apparel.jpg", "3.jpg", "custom-apparel.html"],
    ["graphic design", "slide-graphic-design.jpg", "4.png", "graphic-design.html"],
  ];
  const show = document.getElementById("show");
  const clip = document.getElementById("clip");
  const dots = document.getElementById("dots");
  const slideEls = slides.map(([cap, local, live, page], i) => {
    const a = document.createElement("a");
    a.className = "slide" + (i === 0 ? " on" : "");
    a.href = SITE + page;
    a.innerHTML = '<img alt=""><span class="cap"></span>';
    a.querySelector(".cap").textContent = cap;
    a.querySelector("img").alt = cap;
    loadImg(a.querySelector("img"), "images/" + local, liveImage(live));
    clip.appendChild(a);
    const d = document.createElement("button");
    d.type = "button";
    d.setAttribute("aria-label", "Show " + cap);
    d.setAttribute("aria-current", i === 0);
    d.onclick = () => { go(i); auto(); };
    dots.appendChild(d);
    return a;
  });
  let cur = 0, timer;
  function go(n) {
    slideEls[cur].classList.remove("on");
    dots.children[cur].setAttribute("aria-current", false);
    cur = (n + slideEls.length) % slideEls.length;
    slideEls[cur].classList.add("on");
    dots.children[cur].setAttribute("aria-current", true);
  }
  function auto() {
    clearInterval(timer);
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) timer = setInterval(() => go(cur + 1), 5000);
  }
  show.querySelector(".prev").onclick = () => { go(cur - 1); auto(); };
  show.querySelector(".next").onclick = () => { go(cur + 1); auto(); };
  show.onmouseenter = () => clearInterval(timer);
  show.onmouseleave = auto;
  auto();

  // ---- Product collage: positions match the current site's layout ----
  // [x, y, w, h] in an 850 × 1066 box, in the same order as PRODUCTS
  const spots = [
    [12, 6, 147, 143], [174, 0, 165, 136], [352, 11, 174, 126], [540, 0, 139, 164], [692, 21, 157, 129],
    [33, 163, 198, 246], [250, 151, 228, 241], [489, 178, 174, 246], [677, 180, 151, 211],
    [51, 420, 176, 180], [249, 406, 174, 213], [439, 445, 206, 208], [660, 446, 153, 226],
    [0, 610, 235, 272], [249, 629, 184, 271], [442, 663, 140, 208], [593, 679, 87, 163], [700, 684, 75, 139],
    [460, 879, 119, 120], [265, 906, 176, 159],
  ];
  const tilts = [-1.6, 1.2, -0.6, 1.8, -1.1, 0.8, -1.4, 1.5, -0.9, 1.1];
  const W = 850, H = 1066;
  const pct = (v, t) => (v / t * 100).toFixed(3) + "%";
  const collage = document.getElementById("collage");

  PRODUCTS.forEach(([label, page, live], i) => {
    const [x, y, w, h] = spots[i];
    const a = document.createElement("a");
    a.className = "piece" + (w < 130 ? " small" : "");
    a.href = SITE + page;
    a.style.left = pct(x, W);
    a.style.top = pct(y, H);
    a.style.width = pct(w, W);
    a.style.height = pct(h, H);
    a.style.setProperty("--tilt", tilts[i % tilts.length] + "deg");
    a.innerHTML = '<div class="img"><img alt="" loading="lazy"><span class="label"></span></div>';
    a.querySelector(".label").textContent = label;
    a.querySelector("img").alt = label;
    loadImg(a.querySelector("img"), "images/" + slugify(label) + ".jpg", liveImage(live));
    collage.appendChild(a);
  });
</script>
</body>
</html>
