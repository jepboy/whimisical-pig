<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 448" width="448" height="448">
  <!-- Redrawn from The Whimsical Pig logo: a pink "W" with floppy pig ears -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3b3c4"/>
      <stop offset="0.55" stop-color="#e99bb0"/>
      <stop offset="1" stop-color="#e591a7"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e07f8f"/>
      <stop offset="1" stop-color="#d86f80"/>
    </linearGradient>
    <g id="shape">
      <!-- W body -->
      <path d="M92 196 L158 188 L178 170 L270 170 L290 188 L356 196 L332 298 L236 298 L224 280 L212 298 L116 298 Z"/>
      <!-- left ear, flopped outward -->
      <path d="M164 186 C 152 158, 124 144, 98 146 C 72 148, 48 164, 40 184 C 34 202, 48 214, 68 211 C 92 207, 118 209, 144 220 Z"/>
      <!-- right ear -->
      <path d="M284 186 C 296 158, 324 144, 350 146 C 376 148, 400 164, 408 184 C 414 202, 400 214, 380 211 C 356 207, 330 209, 304 220 Z"/>
    </g>
  </defs>
  <!-- dark outer edge, silver rim -->
  <use href="#shape" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="22" stroke-linejoin="round"/>
  <use href="#shape" fill="#d6d6d6" stroke="#d6d6d6" stroke-width="13" stroke-linejoin="round"/>
  <use href="#shape" fill="url(#skin)"/>
  <!-- inner ear, where the flap folds -->
  <path d="M56 196 C 62 180, 80 172, 98 172 L 104 206 C 86 206, 68 208, 56 196 Z" fill="url(#inner)"/>
  <path d="M392 196 C 386 180, 368 172, 350 172 L 344 206 C 362 206, 380 208, 392 196 Z" fill="url(#inner)"/>
  <path d="M98 172 L 104 206 M 350 172 L 344 206" stroke="#b85a6a" stroke-width="2" opacity="0.7"/>
  <!-- soft sheen across the W -->
  <path d="M178 176 L 270 176 L 242 262 L 224 226 L 206 262 Z" fill="#ffffff" opacity="0.10"/>
  <path d="M116 296 L 150 208 L 206 262 L 212 296 Z" fill="#c95f78" opacity="0.14"/>
</svg>
